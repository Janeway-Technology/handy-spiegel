[package]
name = "handy-spiegel"
version = "1.0.0"
edition = "2021"
description = "Android-Handy auf PC oder TV spiegeln – GTK4-Oberfläche für scrcpy"
license = "MIT"
repository = "https://github.com/Janeway-Technology/handy-spiegel"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
qrcode = { version = "0.14", default-features = false }

[profile.release]
opt-level = 3
lto = true
strip = true
